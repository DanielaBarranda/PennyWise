# PennyWise - Nginx site on EC2 #1 (frontend)
# Installed to /etc/nginx/conf.d/pennywise.conf by deploy/deploy.sh
#
#   Browser --HTTP:80--> Nginx --+-- /          -> React files in /var/www/pennywise
#                                +-- /api/...   -> ASP.NET Core API on EC2 #2 (private IP)

# EC2 #2's PRIVATE address. Traffic to it never leaves the AWS network, and the
# backend security group only accepts port 5000 from the frontend security group.
# If the backend instance is ever replaced, update this IP.
upstream pennywise_api {
    server 172.31.32.247:5000;
    keepalive 8;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name pennywise;

    root /var/www/pennywise;
    index index.html;

    server_tokens off; # hide the Nginx version number

    # Basic browser security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API requests are forwarded unchanged (the /api prefix is kept).
    location /api/ {
        proxy_pass http://pennywise_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        client_max_body_size 64k; # expense and budget requests are tiny
    }

    # Vite puts a content hash in these file names, so browsers may cache them for a long time.
    location /assets/ {
        expires 1y;
    }

    # index.html must always be re-checked so users get new deployments immediately.
    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
