# PennyWise - Nginx site on EC2 #1 (frontend)
# Installed to /etc/nginx/conf.d/pennywise.conf by deploy/deploy.sh
#
#   Browser --HTTPS:443--> Nginx --+-- /          -> React files in /var/www/pennywise
#                                  +-- /api/...   -> ASP.NET Core API on EC2 #2 (private IP)
#
# The TLS certificate comes from Let's Encrypt (free) and is renewed automatically by
# certbot-renew.timer; see deploy/README.md. The connection from Nginx to the API stays
# plain HTTP because it never leaves the private AWS network.

# EC2 #2's PRIVATE address. Traffic to it never leaves the AWS network, and the
# backend security group only accepts port 5000 from the frontend security group.
# If the backend instance is ever replaced, update this IP.
upstream pennywise_api {
    server 172.31.32.247:5000;
    keepalive 8;
}

# Port 80 (HTTP): only answers Let's Encrypt's renewal checks. Every other request,
# including ones to the bare IP address, is redirected to https://penny-wise.app.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name penny-wise.app www.penny-wise.app;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://penny-wise.app$request_uri;
    }
}

# HTTPS requests for any other name (for example https://13.229.192.174) are refused
# instead of being shown a certificate for the wrong name.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
}

# https://www.penny-wise.app -> https://penny-wise.app (one canonical address).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.penny-wise.app;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/penny-wise.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/penny-wise.app/privkey.pem;

    return 301 https://penny-wise.app$request_uri;
}

# The application.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name penny-wise.app;

    ssl_certificate     /etc/letsencrypt/live/penny-wise.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/penny-wise.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:pennywise:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /var/www/pennywise;
    index index.html;

    server_tokens off; # hide the Nginx version number

    # Browser security headers. HSTS tells browsers to use HTTPS for this site
    # for a year (.app domains require HTTPS in browsers anyway).
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API requests are forwarded unchanged (the /api prefix is kept).
    location /api/ {
        proxy_pass http://pennywise_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        client_max_body_size 64k; # expense and budget requests are tiny
    }

    # Profile photo uploads: the only API request bigger than 64 KB. The browser
    # shrinks photos to about 40 KB; the API rejects anything over 256 KB.
    location = /api/auth/avatar {
        proxy_pass http://pennywise_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        client_max_body_size 300k;
    }

    # Vite puts a content hash in these file names, so browsers may cache them for a long time.
    location /assets/ {
        expires 1y;
    }

    # index.html must always be re-checked so users get new deployments immediately.
    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
